name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Build
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/cfnat-linux-amd64 cfnat.go
          chmod +x dist/cfnat-linux-amd64
          tar -C dist -czf dist/cfnat-linux-amd64.tar.gz cfnat-linux-amd64

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/cfnat-linux-arm64 cfnat.go
          chmod +x dist/cfnat-linux-arm64
          tar -C dist -czf dist/cfnat-linux-arm64.tar.gz cfnat-linux-arm64

          cd dist
          sha256sum cfnat-linux-* > checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cfnat-linux-binaries
          path: dist/*

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
